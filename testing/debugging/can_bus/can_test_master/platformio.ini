[platformio]
build_dir = ../../../../build/can_test_master
default_envs = can_test_master

[env]
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
upload_protocol = picotool
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
build_flags =
	-I ../include
	-DKTANE_TEST_DUAL_CONSOLE
	-DCAN_TEST_EXPECT_INSTANCE=2
	-DCAN_TEST_BLOCK_INSTANCE_1=1
lib_deps =
	coryjfowler/mcp_can@^1.5.1
lib_extra_dirs =
	../../../../shared_libs

[env:can_test_master]
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3

; No synthetic ID_TAKEN — slave should win instance 1 (use without can_test_occupier).
[env:can_test_master_clear]
extends = env:can_test_master
build_flags =
	-I ../include
	-DKTANE_TEST_DUAL_CONSOLE
	-DCAN_TEST_EXPECT_INSTANCE=1
	-DCAN_TEST_BLOCK_INSTANCE_1=0
