[platformio]
build_dir = ../../../../build/can_test_occupier
default_envs = can_test_occupier

[env]
framework = arduino
monitor_speed = 115200
upload_protocol = picotool
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
build_flags =
	-I ../include
	-DKTANE_TEST_DUAL_CONSOLE
lib_deps =
	coryjfowler/mcp_can@^1.5.1
lib_extra_dirs =
	../../../../shared_libs

[env:can_test_occupier]
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3
