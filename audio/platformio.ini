[platformio]
build_dir = ../build/audio
default_envs = audio

[env]
framework = arduino
monitor_speed = 115200
; Console UART via Picoprobe (GP0/GP1). Pico W USB CDC is typically the other cu.usbmodem*.
monitor_port = /dev/cu.usbmodem11102
upload_protocol = cmsis-dap
monitor_flags = --echo
; CMSIS-DAP (Picoprobe) is usually auto-detected; set upload_port if you have multiple probes.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
board_build.core = earlephilhower
build_flags =
	-DEDGE_AUDIO
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
	-DKTANE_PICOPROBE_UART

lib_deps =
	coryjfowler/mcp_can@^1.5.1
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/adafruit/Adafruit_TLV320_I2S.git
lib_extra_dirs =
	../shared_libs

[env:audio]
debug_tool = cmsis-dap
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3
