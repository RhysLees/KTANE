; SD WAV -> I2S test (same hardware as ../audio: TLV320 + SPI1 SD).
; Paths match sound_bank (see ../audio/lib/sound_bank/sound_bank.cpp).
; I2S buffering: https://github.com/pschatzmann/arduino-audio-tools/discussions/1884
[platformio]
build_dir = ../build/audio_test
default_envs = audio_test

[env]
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem11102
upload_protocol = cmsis-dap
monitor_flags = --echo
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
board_build.core = earlephilhower
build_flags =
	-DKTANE_PICOPROBE_UART
lib_deps =
	coryjfowler/mcp_can@^1.5.1
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/adafruit/Adafruit_TLV320_I2S.git
lib_extra_dirs =
	../shared_libs
	../audio/lib

[env:audio_test]
debug_tool = cmsis-dap
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3
